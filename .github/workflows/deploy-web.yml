# Web app sur GitHub Pages (https://niorgen.github.io/loompath/) à chaque push sur master.
# Prérequis dans les réglages du dépôt :
#  - Settings > Pages > Source : « GitHub Actions »
#  - Settings > Secrets and variables > Actions : secret EXPO_PUBLIC_CARTO_API_KEY
name: Déploiement web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /loompath
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
      # Pages ne sait pas réécrire les URL : 404.html recharge l'app, qui lit la route
      # (liens directs vers /loompath/prouesses…). .nojekyll garde le dossier _expo.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
